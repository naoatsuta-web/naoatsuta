<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マリオカート風レースゲーム</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-overlay">
            <div id="lap-counter">LAP: 1/3</div>
            <div id="position">順位: 1st</div>
            <div id="item-box"></div>
            <div id="speed-meter">
                <div id="speed-bar"></div>
            </div>
        </div>
        <div id="start-screen">
            <h1>🏎️ レースゲーム 🏎️</h1>
            <p>矢印キーで操作</p>
            <p>↑ アクセル | ↓ ブレーキ</p>
            <p>← → ハンドル</p>
            <p>スペース: アイテム使用</p>
            <button id="start-btn">スタート!</button>
        </div>
        <div id="countdown" style="display: none;"></div>
        <div id="result-screen" style="display: none;">
            <h1 id="result-title">ゴール!</h1>
            <p id="result-time"></p>
            <p id="result-position"></p>
            <button id="restart-btn">もう一度プレイ</button>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
